[package]
name = "our-pets-desktop"
version = "0.1.0-beta.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jiind/our-pets"
description = "로컬망 사용자와 함께하는 데스크톱 펫"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bollard = { version = "0.21.1", features = ["ssl"] }
futures-util = { version = "0.3", features = ["sink"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt-multi-thread", "process", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
cairo-rs = "0.18"

x11rb = { version = "0.13.2", features = ["record"] }
