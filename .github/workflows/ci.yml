name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 고정 버전 Gitleaks 준비
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' \
            | (cd "$scanner_dir" && sha256sum --check --status)
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
      - name: Git 전체 이력 검사
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts=--all \
            --redact=100 --no-banner --no-color --ignore-gitleaks-allow
      - name: 현재 파일 검사
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . \
            --redact=100 --no-banner --no-color --ignore-gitleaks-allow

  repository:
    name: Repository checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 워크플로 정적 검사
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/release.yml
      - name: 버전 일치 확인
        run: python3 scripts/check_versions.py
      - name: 공개 파일 제외 규칙 확인
        shell: bash
        run: |
          set -euo pipefail
          for path in .env .env.production credentials.json auth.json session.json private.pem client.key data/app.sqlite3 desktop/test-results/result.png; do
            git check-ignore --quiet --no-index "$path"
          done
          if git check-ignore --quiet --no-index examples/server.env.example; then
            echo '설정 예제가 제외되어 있습니다.' >&2
            exit 1
          fi
      - name: 배포 고지 확인
        run: python3 scripts/prepare_notices.py --check

  server:
    name: Go checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/our-pets

  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run build
      - run: npm run check:ui-types
      - run: npm test
      - name: 기존 Chrome 확인
        run: google-chrome --version
      - name: 격리된 브라우저 회귀 검사
        run: npm run test:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure
          path: desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Linux 빌드 의존성
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - run: npm ci
      - run: npm run build
      - name: Rust 단위 검사
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: 네이티브 실행 파일 빌드
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml

  required:
    name: CI required
    if: always()
    needs: [secrets, repository, server, frontend, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      SECRETS: ${{ needs.secrets.result }}
      REPOSITORY: ${{ needs.repository.result }}
      SERVER: ${{ needs.server.result }}
      FRONTEND: ${{ needs.frontend.result }}
      NATIVE: ${{ needs.native.result }}
    steps:
      - name: 모든 필수 검사 결과 확인
        shell: bash
        run: |
          set -euo pipefail
          for result in "$SECRETS" "$REPOSITORY" "$SERVER" "$FRONTEND" "$NATIVE"; do
            test "$result" = success
          done
