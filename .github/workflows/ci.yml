name: Recover v0.1.0 Linux packages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  desktop:
    name: Package desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tagged application source
        working-directory: .
        run: |
          git diff --exit-code v0.1.0 HEAD -- . ':(exclude).github/workflows/ci.yml' ':(exclude)scripts/linux_distribution_sources.py'
          python3 scripts/check_versions.py --tag v0.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Linux 패키지 의존성
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          lines = Path('/etc/apt/sources.list').read_text().splitlines()
          source_lines = [line.replace('deb ', 'deb-src ', 1) for line in lines if line.startswith('deb ')]
          if not source_lines:
              raise SystemExit('Ubuntu source repositories could not be identified.')
          Path('/tmp/our-pets-source-repositories.list').write_text('\n'.join(source_lines) + '\n')
          PYTHON
          sudo install -m 644 /tmp/our-pets-source-repositories.list /etc/apt/sources.list.d/our-pets-source.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
          # 러너 이미지의 오래된 라이브러리를 현재 소스 저장소와 같은 버전으로 맞춘다.
          mapfile -t libraries < <(dpkg-query -W -f='${binary:Package}\t${db:Status-Status}\n' 'lib*' | awk '$2 == "installed" {print $1}')
          sudo apt-get install -y --only-upgrade --no-install-recommends "${libraries[@]}"
      - run: npm ci
      - name: 설치 파일 생성
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri -- build --ci ${{ matrix.args }} -- --locked
      - name: 고지와 패키지 수집
        env:
          PACKAGE_PLATFORM: ${{ matrix.name }}
        run: python ../scripts/package_release.py desktop --platform "$PACKAGE_PLATFORM"
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 14
